<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학회 소식 | (사)마이스홍보교육학회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3d3dc8;
    --bg: #f8f8f8;
    --text: #1a1a1a;
    --text-mid: #444;
    --text-light: #999;
    --border: #e8e8e8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }

  /* 상단 바 */
  .top-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.82rem; color: var(--primary);
    text-decoration: none; font-weight: 500;
    padding: 5px 12px; border-radius: 4px;
    border: 1px solid var(--primary);
    transition: background 0.15s;
  }
  .back-btn:hover { background: #f0f0ff; }
  .top-bar-title { font-size: 0.82rem; color: var(--text-light); }

  /* 본문 카드 */
  .post-wrap {
    max-width: 720px;
    margin: 40px auto 80px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 20px rgba(0,0,0,0.06);
  }

  /* 메타 */
  .post-meta {
    display: flex; align-items: center; gap: 8px;
    padding: 24px 36px 0;
    flex-wrap: wrap;
  }
  .post-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: #fff; font-weight: 700; flex-shrink: 0;
  }
  .post-author { font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .post-dot { color: var(--text-light); }
  .post-date { font-size: 0.78rem; color: var(--text-light); }
  .post-more { margin-left: auto; background: none; border: none; color: var(--text-light); font-size: 1rem; cursor: pointer; }
  .post-cat-badge { font-size: 0.68rem; font-weight: 700; padding: 2px 9px; border-radius: 3px; color: #fff; }

  /* 제목 */
  .post-title {
    font-size: 1.75rem; font-weight: 700;
    color: var(--text); line-height: 1.35;
    letter-spacing: -0.025em;
    padding: 20px 36px 0;
  }

  /* 구분선 */
  .post-divider { border: none; border-top: 1px solid var(--border); margin: 24px 36px 0; }

  /* 본문 */
  .post-body { padding: 24px 36px 0; }
  .post-section-heading {
    font-size: 1rem; font-weight: 600;
    color: var(--text); margin-bottom: 14px;
    text-align: center;
  }
  .post-text {
    font-size: 0.9rem; line-height: 2.0;
    color: var(--text-mid); text-align: center;
    white-space: pre-wrap;
  }

  /* 이미지 */
  .post-images {
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    padding: 24px 36px 0;
  }
  .post-images img {
    max-width: 100%; border-radius: 4px;
    object-fit: contain;
  }

  /* PDF 링크 */
  .post-pdfs { padding: 20px 36px 36px; display: flex; flex-direction: column; gap: 10px; }
  .pdf-link {
    display: flex; align-items: center; gap: 14px;
    background: #f6f6fb; border: 1px solid #e0e0f0;
    border-radius: 4px; padding: 14px 18px;
    font-size: 0.82rem; color: var(--text-mid);
    text-decoration: none; transition: background 0.15s, border-color 0.15s;
  }
  .pdf-link:hover { background: #eeeeff; border-color: var(--primary); }
  .pdf-link .ico { font-size: 1.6rem; flex-shrink: 0; }
  .pdf-link strong { display: block; color: var(--text); margin-bottom: 2px; }
  .pdf-link span { color: var(--primary); font-size: 0.76rem; }

  /* 없는 글 */
  .not-found { text-align: center; padding: 80px 20px; color: var(--text-light); font-size: 0.9rem; }

  @media (max-width: 700px) {
    .post-wrap { margin: 16px; }
    .post-title { font-size: 1.3rem; padding: 16px 20px 0; }
    .post-meta { padding: 18px 20px 0; }
    .post-body { padding: 18px 20px 0; }
    .post-images { padding: 18px 20px 0; }
    .post-pdfs { padding: 16px 20px 28px; }
    .post-divider { margin: 18px 20px 0; }
    .top-bar { padding: 12px 16px; }
  }
</style>
</head>

// URL에서 id 파싱
const params = new URLSearchParams(location.search);
const id = parseInt(params.get('id'));
const p = POSTS.find(x => x.id === id);
const el = document.getElementById('content');

if (!p) {
  el.innerHTML = '<div class="not-found">존재하지 않는 게시물입니다.</div>';
} else {
  const cfg = CAT[p.cat];
  const lines = p.body.split('\n');
  let headingHtml = '', bodyText = p.body;
  if (lines[0].startsWith('【') && lines[0].endsWith('】')) {
    headingHtml = `<div class="post-section-heading">${lines[0].replace(/【|】/g,'').trim()}</div>`;
    bodyText = lines.slice(1).join('\n').trim();
  }

  // PDF 링크
  let pdfHtml = '';
  if (p.pdf) {
    pdfHtml = `<div class="post-pdfs"><a class="pdf-link" href="${p.pdf.url}" target="_blank"><span class="ico">📄</span><div><strong>${p.pdf.name}</strong><span>Google Drive에서 열기 →</span></div></a></div>`;
  } else if (p.pdfs) {
    pdfHtml = `<div class="post-pdfs">${p.pdfs.map(f=>`<a class="pdf-link" href="${f.url}" target="_blank"><span class="ico">📄</span><div><strong>${f.name}</strong><span>Google Drive에서 열기 →</span></div></a>`).join('')}</div>`;
  }

  // 이미지
  const imgHtml = (p.images||[]).length
    ? `<div class="post-images">${p.images.map(s=>`<img src="${s}" alt="첨부이미지" loading="lazy">`).join('')}</div>`
    : '';

  document.title = `${p.title} | (사)마이스홍보교육학회`;

  el.innerHTML = `
  <div class="post-wrap">
    <div class="post-meta">
      <div class="post-avatar">sn</div>
      <span class="post-author">snsmedia</span>
      <span class="post-dot">·</span>
      <span class="post-date">${p.date} · ${p.read}</span>
      <span class="post-cat-badge" style="background:${cfg.color}">${cfg.label}</span>
      <button class="post-more">⋯</button>
    </div>
    <div class="post-title">${p.title}</div>
    <hr class="post-divider">
    <div class="post-body">
      ${headingHtml}
      <div class="post-text">${bodyText.replace(/\n/g,'<br>')}</div>
    </div>
    ${imgHtml}
    ${pdfHtml}
  </div>`;
}
