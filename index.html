<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학회 소식 | (사)마이스홍보교육학회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3d3dc8;
    --primary-dark: #2b2b9a;
    --bg: #ffffff;
    --text: #1a1a1a;
    --text-mid: #444;
    --text-light: #999;
    --border: #e8e8e8;
    --hero-bg: #1a1a2e;
    --heart: #e0e0e0;
    --heart-active: #e05555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ── 상단 네비 ── */
  .top-nav {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    border-bottom: 1px solid var(--border);
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 200;
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  .nav-logo-icon {
    width: 40px; height: 40px;
    background: var(--primary);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 0.65rem; font-weight: 700;
    line-height: 1.2; text-align: center; padding: 4px;
  }
  .nav-logo-text { line-height: 1.25; }
  .nav-logo-text .ko { font-size: 0.82rem; font-weight: 700; color: var(--text); }
  .nav-logo-text .en { font-size: 0.6rem; color: var(--text-light); letter-spacing: 0.05em; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    font-size: 0.82rem; color: var(--text-mid); text-decoration: none;
    font-weight: 500; transition: color 0.15s;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--primary); }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-login {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.82rem; color: var(--text-mid); cursor: pointer;
  }
  .nav-login svg { width: 20px; height: 20px; }

  /* ── 검색바 ── */
  .search-bar-wrap {
    border-bottom: 1px solid var(--border);
    padding: 10px 40px;
    background: #fff;
  }
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    max-width: 420px;
    border-bottom: 2px solid var(--primary);
    padding-bottom: 6px;
  }
  .search-bar input {
    border: none; outline: none; font-size: 0.9rem;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text-mid); width: 100%; background: transparent;
  }
  .search-bar input::placeholder { color: #bbb; }
  .search-bar svg { color: var(--text-light); flex-shrink: 0; }

  /* ── 히어로 배너 ── */
  .hero {
    height: 200px;
    background: linear-gradient(rgba(20,20,40,0.55), rgba(20,20,40,0.55)),
      url('https://static.wixstatic.com/media/7acfd4_85b1ea1d4efd4e47a9ac2a39a61710b7~mv2.jpg') center/cover;
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: flex-end;
    padding: 0 40px 32px;
  }
  .hero-label {
    font-size: 0.72rem; font-weight: 500; color: rgba(255,255,255,0.7);
    letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px;
  }
  .hero-title {
    font-size: 2rem; font-weight: 700; color: #fff;
    letter-spacing: -0.02em;
  }

  /* ── All Posts 링크 ── */
  .all-posts-bar {
    padding: 20px 40px 0;
    border-bottom: 1px solid var(--border);
  }
  .all-posts-link {
    display: inline-block;
    font-size: 0.88rem; font-weight: 500;
    color: var(--primary); text-decoration: none;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--primary);
  }

  /* ── 포스트 리스트 ── */
  .post-list {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 40px 80px;
  }

  .post-item {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 40px 0;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .post-item:hover { opacity: 0.85; }
  .post-item:first-child { padding-top: 36px; }

  /* 썸네일 — Wix 원본은 좌측 큰 정사각형 이미지 */
  .post-thumb {
    width: 240px;
    min-width: 240px;
    height: 180px;
    border-radius: 2px;
    overflow: hidden;
    background: #f0f0f5;
    margin-right: 28px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
    color: #aaa;
  }
  .post-thumb img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .post-thumb.no-img { background: #f4f4f8; }

  /* 우측 텍스트 */
  .post-info { flex: 1; display: flex; flex-direction: column; }

  .post-meta-top {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .post-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: #fff; font-weight: 700;
    flex-shrink: 0;
  }
  .post-author { font-size: 0.78rem; font-weight: 500; color: var(--text-mid); }
  .post-date-read { font-size: 0.75rem; color: var(--text-light); }
  .post-dot { color: var(--text-light); font-size: 0.7rem; }
  .post-more-btn {
    margin-left: auto;
    background: none; border: none; cursor: pointer;
    color: var(--text-light); font-size: 1.1rem; padding: 2px 6px;
    border-radius: 4px; line-height: 1;
  }
  .post-more-btn:hover { background: #f0f0f0; }

  .post-title {
    font-size: 1.05rem; font-weight: 700;
    color: var(--text); margin-bottom: 10px;
    line-height: 1.4;
  }
  .post-excerpt {
    font-size: 0.82rem; color: var(--text-mid);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .post-footer {
    display: flex; align-items: center; gap: 16px;
    margin-top: 14px;
  }
  .post-stats { font-size: 0.75rem; color: var(--text-light); }
  .post-heart {
    margin-left: auto;
    background: none; border: none; cursor: pointer;
    color: var(--heart); font-size: 1.1rem;
    transition: color 0.15s; padding: 0;
  }
  .post-heart.liked { color: var(--heart-active); }
  .post-cat-badge {
    font-size: 0.68rem; font-weight: 700;
    padding: 2px 8px; border-radius: 3px; color: #fff;
    letter-spacing: 0.04em;
  }

  /* ── 페이지네이션 ── */
  .pagination {
    display: flex; justify-content: center; gap: 4px;
    padding: 32px 40px 60px;
  }
  .page-btn {
    min-width: 36px; height: 36px; padding: 0 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent; font-size: 0.82rem;
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text-mid); transition: all 0.15s;
  }
  .page-btn:hover { border-color: var(--primary); color: var(--primary); }
  .page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }

  /* ── 필터 탭 (All Posts 바 아래) ── */
  .cat-tabs {
    padding: 0 40px;
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    max-width: 900px; margin: 0 auto;
  }
  .cat-tab {
    padding: 14px 18px 12px;
    font-size: 0.82rem; font-weight: 500;
    color: var(--text-light); cursor: pointer;
    border-bottom: 2px solid transparent;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-tab:hover { color: var(--text); }
  .cat-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }

  /* ── 모달 ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 500;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 60px 20px 40px;
    overflow-y: auto;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: #fff;
    border-radius: 4px;
    width: 100%; max-width: 760px;
    overflow: hidden;
    transform: translateY(20px);
    transition: transform 0.2s;
    margin: auto;
    position: relative;
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  .modal-close {
    position: absolute; top: 14px; right: 18px;
    background: rgba(255,255,255,0.9); border: none;
    border-radius: 50%; width: 32px; height: 32px;
    font-size: 1rem; cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    color: #333;
  }

  .modal-hero-img {
    width: 100%; height: 280px; object-fit: cover;
    display: block;
  }
  .modal-hero-placeholder {
    width: 100%; height: 140px;
    background: #f0f0f8;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; color: #aaa;
  }

  .modal-body-wrap { padding: 32px 40px 44px; }

  .modal-meta-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .modal-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: #fff; font-weight: 700;
  }
  .modal-author { font-size: 0.8rem; font-weight: 600; color: var(--text-mid); }
  .modal-date-txt { font-size: 0.75rem; color: var(--text-light); }
  .modal-cat-badge {
    font-size: 0.68rem; font-weight: 700;
    padding: 2px 8px; border-radius: 3px; color: #fff;
    margin-left: auto;
  }

  .modal-title {
    font-size: 1.6rem; font-weight: 700;
    color: var(--text); margin-bottom: 24px;
    line-height: 1.4; letter-spacing: -0.02em;
  }
  .modal-text {
    font-size: 0.9rem; line-height: 1.9;
    color: var(--text-mid); white-space: pre-wrap;
  }
  .modal-imgs {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px;
  }
  .modal-imgs img {
    height: 170px; border-radius: 3px;
    object-fit: cover; border: 1px solid var(--border);
  }
  .pdf-box {
    display: flex; align-items: center; gap: 14px;
    background: #f6f6fb; border: 1px solid #e0e0f0;
    border-radius: 4px; padding: 16px 20px; margin-top: 20px;
    font-size: 0.82rem; color: var(--text-mid);
  }
  .pdf-box .ico { font-size: 1.8rem; }

  /* 반응형 */
  @media (max-width: 700px) {
    .top-nav { padding: 0 20px; }
    .nav-links { display: none; }
    .hero { padding: 0 20px 24px; height: 160px; }
    .all-posts-bar, .search-bar-wrap { padding-left: 20px; padding-right: 20px; }
    .post-list { padding: 0 20px 60px; }
    .post-thumb { width: 120px; min-width: 120px; height: 100px; margin-right: 16px; }
    .post-title { font-size: 0.9rem; }
    .modal-body-wrap { padding: 20px 20px 32px; }
    .modal-title { font-size: 1.25rem; }
    .cat-tabs { padding: 0 20px; overflow-x: auto; }
    .pagination { padding: 20px; }
  }
</style>
</head>

// ═══════════════════════════════════════
//  상태
// ═══════════════════════════════════════
const PER = 5;
let curCat = 'all', curPage = 1, filtered = [...POSTS], searchQ = '';
const liked = new Set();

function getFiltered(cat, q) {
  return POSTS.filter(p =>
    (cat === 'all' || p.cat === cat) &&
    (!q || p.title.includes(q) || p.excerpt.includes(q))
  );
}

// ═══════════════════════════════════════
//  렌더
// ═══════════════════════════════════════
function render() {
  filtered = getFiltered(curCat, searchQ);
  const list = document.getElementById('postList');
  const slice = filtered.slice((curPage-1)*PER, curPage*PER);

  if (!slice.length) {
    list.innerHTML = '<div style="padding:60px 0;text-align:center;color:#aaa;font-size:0.9rem;">검색 결과가 없습니다.</div>';
  } else {
    list.innerHTML = slice.map(p => {
      const cfg = CAT[p.cat];
      const thumbHtml = p.thumb
        ? `<img src="${p.thumb}" alt="${p.title}" loading="lazy">`
        : `<span style="font-size:2rem">${{festival:'🏮',publish:'📖',report:'📋',history:'🏛'}[p.cat]}</span>`;
      const thumbCls = p.thumb ? 'post-thumb' : 'post-thumb no-img';
      return `
      <div class="post-item" onclick="openPost(${p.id})">
        <div class="${thumbCls}">${thumbHtml}</div>
        <div class="post-info">
          <div class="post-meta-top">
            <div class="post-avatar">sn</div>
            <span class="post-author">snsmedia</span>
            <span class="post-dot">·</span>
            <span class="post-date-read">${p.date} · ${p.read}</span>
            <button class="post-more-btn" onclick="event.stopPropagation()">⋯</button>
          </div>
          <div class="post-title">${p.title}</div>
          <div class="post-excerpt">${p.excerpt}</div>
          <div class="post-footer">
            <span class="post-stats">조회수 ${p.views}회 · 댓글 ${p.comments}개</span>
            <span class="post-cat-badge" style="background:${cfg.color}">${cfg.label}</span>
            <button class="post-heart${liked.has(p.id)?' liked':''}"
              onclick="event.stopPropagation();toggleHeart(${p.id},this)">♥</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PER);
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }
  let h = '';
  if (curPage > 1) h += `<button class="page-btn" onclick="goPage(${curPage-1})">‹</button>`;
  for (let i = 1; i <= total; i++)
    h += `<button class="page-btn${i===curPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  if (curPage < total) h += `<button class="page-btn" onclick="goPage(${curPage+1})">›</button>`;
  pg.innerHTML = h;
}

function goPage(n) { curPage = n; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function filterPosts(cat, btn) {
  curCat = cat; curPage = 1;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function handleSearch(v) { searchQ = v.trim(); curPage = 1; render(); }

function toggleHeart(id, btn) {
  if (liked.has(id)) { liked.delete(id); btn.classList.remove('liked'); }
  else { liked.add(id); btn.classList.add('liked'); }
}

// ═══════════════════════════════════════
//  모달
// ═══════════════════════════════════════
function openPost(id) {
  const p = POSTS.find(x => x.id === id);
  if (!p) return;
  const cfg = CAT[p.cat];

  // 히어로
  const hw = document.getElementById('modalHeroWrap');
  hw.innerHTML = p.thumb
    ? `<img class="modal-hero-img" src="${p.thumb}" alt="${p.title}">`
    : `<div class="modal-hero-placeholder">${{festival:'🏮',publish:'📖',report:'📋',history:'🏛'}[p.cat]}</div>`;

  // 메타
  document.getElementById('modalMeta').innerHTML = `
    <div class="modal-avatar">sn</div>
    <span class="modal-author">snsmedia</span>
    <span style="font-size:0.75rem;color:#999">·</span>
    <span class="modal-date-txt">${p.date} · ${p.read}</span>
    <span class="modal-cat-badge" style="background:${cfg.color}">${cfg.label}</span>`;

  document.getElementById('modalTitle').textContent = p.title;
  document.getElementById('modalText').textContent = p.body;

  // 이미지
  document.getElementById('modalImgs').innerHTML = (p.images||[]).map(src =>
    `<img src="${src}" alt="첨부이미지" loading="lazy">`).join('');

  // PDF
  document.getElementById('modalPdf').innerHTML = p.pdf
    ? `<div class="pdf-box"><span class="ico">📄</span><div><strong>${p.pdf}</strong><br>원본 PDF는 기존 Wix 사이트에서 다운로드하실 수 있습니다.</div></div>`
    : '';

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeByOverlay(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// 초기 렌더
render();
</script>
</body>
