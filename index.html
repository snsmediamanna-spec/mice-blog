<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학회 소식 | (사)마이스홍보교육학회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3d3dc8;
    --primary-dark: #2b2b9a;
    --bg: #ffffff;
    --text: #1a1a1a;
    --text-mid: #444;
    --text-light: #999;
    --border: #e8e8e8;

    --heart: #e0e0e0;
    --heart-active: #e05555;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* 네비/히어로 없음 — embed 전용 */

  /* ── All Posts 링크 ── */
  .all-posts-bar {
    padding: 20px 40px 0;
    border-bottom: 1px solid var(--border);
  }
  .all-posts-link {
    display: inline-block;
    font-size: 0.88rem; font-weight: 500;
    color: var(--primary); text-decoration: none;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--primary);
  }

  /* ── 포스트 리스트 ── */
  .post-list {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 40px 80px;
  }

  .post-item {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 40px 0;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .post-item:hover { opacity: 0.85; }
  .post-item:first-child { padding-top: 36px; }

  /* 썸네일 — Wix 원본은 좌측 큰 정사각형 이미지 */
  .post-thumb {
    width: 240px;
    min-width: 240px;
    height: 180px;
    border-radius: 2px;
    overflow: hidden;
    background: #f0f0f5;
    margin-right: 28px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
    color: #aaa;
  }
  .post-thumb img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .post-thumb.no-img { background: #f4f4f8; }

  /* 우측 텍스트 */
  .post-info { flex: 1; display: flex; flex-direction: column; }

  .post-meta-top {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px;
  }
  .post-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: #fff; font-weight: 700;
    flex-shrink: 0;
  }
  .post-author { font-size: 0.78rem; font-weight: 500; color: var(--text-mid); }
  .post-date-read { font-size: 0.75rem; color: var(--text-light); }
  .post-dot { color: var(--text-light); font-size: 0.7rem; }
  .post-more-btn {
    margin-left: auto;
    background: none; border: none; cursor: pointer;
    color: var(--text-light); font-size: 1.1rem; padding: 2px 6px;
    border-radius: 4px; line-height: 1;
  }
  .post-more-btn:hover { background: #f0f0f0; }

  .post-title {
    font-size: 1.05rem; font-weight: 700;
    color: var(--text); margin-bottom: 10px;
    line-height: 1.4;
  }
  .post-excerpt {
    font-size: 0.82rem; color: var(--text-mid);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .post-footer {
    display: flex; align-items: center; gap: 16px;
    margin-top: 14px;
  }
  .post-stats { font-size: 0.75rem; color: var(--text-light); }
  .post-heart {
    margin-left: auto;
    background: none; border: none; cursor: pointer;
    color: var(--heart); font-size: 1.1rem;
    transition: color 0.15s; padding: 0;
  }
  .post-heart.liked { color: var(--heart-active); }
  .post-cat-badge {
    font-size: 0.68rem; font-weight: 700;
    padding: 2px 8px; border-radius: 3px; color: #fff;
    letter-spacing: 0.04em;
  }

  /* ── 페이지네이션 ── */
  .pagination {
    display: flex; justify-content: center; gap: 4px;
    padding: 32px 40px 60px;
  }
  .page-btn {
    min-width: 36px; height: 36px; padding: 0 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent; font-size: 0.82rem;
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text-mid); transition: all 0.15s;
  }
  .page-btn:hover { border-color: var(--primary); color: var(--primary); }
  .page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }

  /* ── 필터 탭 (All Posts 바 아래) ── */
  .cat-tabs {
    padding: 0 40px;
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    max-width: 900px; margin: 0 auto;
  }
  .cat-tab {
    padding: 14px 18px 12px;
    font-size: 0.82rem; font-weight: 500;
    color: var(--text-light); cursor: pointer;
    border-bottom: 2px solid transparent;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-tab:hover { color: var(--text); }
  .cat-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; }

  /* ── 모달 (Wix 원본 스타일: 흰 카드 + 중앙 본문) ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 500;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px 60px;
    overflow-y: auto;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  /* 전체 카드 — 흰 배경, 테두리, 둥근 모서리 */
  .modal {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%; max-width: 680px;
    overflow: hidden;
    transform: translateY(16px);
    transition: transform 0.22s;
    margin: auto;
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,0.14);
  }
  .modal-overlay.open .modal { transform: translateY(0); }

  /* 닫기 버튼 */
  .modal-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none;
    font-size: 1.1rem; cursor: pointer; z-index: 10;
    color: var(--text-light); line-height: 1;
    padding: 4px 6px; border-radius: 4px;
    transition: color 0.15s;
  }
  .modal-close:hover { color: var(--text); }

  /* 상단 메타 (아바타 + 작성자 + 날짜) — 좌측 정렬 */
  .modal-meta-row {
    display: flex; align-items: center; gap: 8px;
    padding: 20px 28px 0;
    flex-wrap: wrap;
  }
  .modal-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
    background: #e8e8f0;
  }
  .modal-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .modal-avatar-txt {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; color: #fff; font-weight: 700; flex-shrink: 0;
  }
  .modal-author { font-size: 0.82rem; font-weight: 600; color: var(--text); }
  .modal-dot { color: var(--text-light); font-size: 0.75rem; }
  .modal-date-txt { font-size: 0.78rem; color: var(--text-light); }
  .modal-more {
    margin-left: auto; background: none; border: none;
    color: var(--text-light); font-size: 1rem; cursor: pointer;
    padding: 2px 4px;
  }

  /* 본문 래퍼 — 중앙 정렬 */
  .modal-body-wrap {
    padding: 20px 28px 44px;
    text-align: center;
  }

  /* 큰 제목 — Wix 원본처럼 굵고 크게 */
  .modal-title {
    font-size: 1.75rem; font-weight: 700;
    color: var(--text);
    line-height: 1.35; letter-spacing: -0.025em;
    margin-bottom: 28px;
    text-align: left;
  }

  /* 소제목 (선정 기준 등) */
  .modal-section-heading {
    font-size: 1rem; font-weight: 600;
    color: var(--text); margin-bottom: 14px;
    text-align: center;
  }

  /* 본문 텍스트 — 중앙 정렬, 줄간격 넉넉 */
  .modal-text {
    font-size: 0.88rem; line-height: 2.0;
    color: var(--text-mid);
    text-align: center;
    white-space: pre-wrap;
  }

  /* 이미지 — 중앙 정렬, 세로로 쌓기 */
  .modal-imgs {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 28px;
  }
  .modal-imgs img {
    max-width: 100%;
    width: auto;
    max-height: 500px;
    border-radius: 4px;
    object-fit: contain;
  }

  .pdf-box {
    display: flex; align-items: center; gap: 14px;
    background: #f6f6fb; border: 1px solid #e0e0f0;
    border-radius: 4px; padding: 16px 20px; margin-top: 12px;
    font-size: 0.82rem; color: var(--text-mid);
    text-align: left; text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
    cursor: pointer;
  }
  .pdf-box:hover { background: #eeeeff; border-color: var(--primary); }
  .pdf-box .ico { font-size: 1.8rem; flex-shrink: 0; }

  /* 반응형 */
  @media (max-width: 700px) {
    .all-posts-bar { padding-left: 16px; padding-right: 16px; }
    .post-list { padding: 0 16px 60px; }
    .post-thumb { width: 110px; min-width: 110px; height: 90px; margin-right: 14px; }
    .post-title { font-size: 0.88rem; }
    .modal-meta-row { padding: 16px 18px 0; }
    .modal-body-wrap { padding: 16px 18px 36px; }
    .modal-title { font-size: 1.3rem; }
    .cat-tabs { padding: 0 16px; overflow-x: auto; }
    .pagination { padding: 20px; }
  }
</style>
</head>

// ═══════════════════════════════════════
//  상태
// ═══════════════════════════════════════
const PER = 5;
let curCat = 'all', curPage = 1, filtered = [...POSTS], searchQ = '';
const liked = new Set();

function getFiltered(cat, q) {
  return POSTS.filter(p =>
    (cat === 'all' || p.cat === cat) &&
    (!q || p.title.includes(q) || p.excerpt.includes(q))
  );
}

// ═══════════════════════════════════════
//  렌더
// ═══════════════════════════════════════
function render() {
  filtered = getFiltered(curCat, searchQ);
  const list = document.getElementById('postList');
  const slice = filtered.slice((curPage-1)*PER, curPage*PER);

  if (!slice.length) {
    list.innerHTML = '<div style="padding:60px 0;text-align:center;color:#aaa;font-size:0.9rem;">검색 결과가 없습니다.</div>';
  } else {
    list.innerHTML = slice.map(p => {
      const cfg = CAT[p.cat];
      const thumbHtml = p.thumb
        ? `<img src="${p.thumb}" alt="${p.title}" loading="lazy">`
        : `<span style="font-size:2rem">${{festival:'🏮',publish:'📖',report:'📋',history:'🏛'}[p.cat]}</span>`;
      const thumbCls = p.thumb ? 'post-thumb' : 'post-thumb no-img';
      return `
      <div class="post-item" onclick="openPost(${p.id})">
        <div class="${thumbCls}">${thumbHtml}</div>
        <div class="post-info">
          <div class="post-meta-top">
            <div class="post-avatar">sn</div>
            <span class="post-author">snsmedia</span>
            <span class="post-dot">·</span>
            <span class="post-date-read">${p.date} · ${p.read}</span>
            <button class="post-more-btn" onclick="event.stopPropagation()">⋯</button>
          </div>
          <div class="post-title">${p.title}</div>
          <div class="post-excerpt">${p.excerpt}</div>
          <div class="post-footer">
            <span class="post-stats">조회수 ${p.views}회 · 댓글 ${p.comments}개</span>
            <span class="post-cat-badge" style="background:${cfg.color}">${cfg.label}</span>
            <button class="post-heart${liked.has(p.id)?' liked':''}"
              onclick="event.stopPropagation();toggleHeart(${p.id},this)">♥</button>
          </div>
        </div>
      </div>`;
    }).join('');
  }
  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PER);
  const pg = document.getElementById('pagination');
  if (total <= 1) { pg.innerHTML = ''; return; }
  let h = '';
  if (curPage > 1) h += `<button class="page-btn" onclick="goPage(${curPage-1})">‹</button>`;
  for (let i = 1; i <= total; i++)
    h += `<button class="page-btn${i===curPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  if (curPage < total) h += `<button class="page-btn" onclick="goPage(${curPage+1})">›</button>`;
  pg.innerHTML = h;
}

function goPage(n) { curPage = n; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function filterPosts(cat, btn) {
  curCat = cat; curPage = 1;
  document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  render();
}

function handleSearch(v) { searchQ = v.trim(); curPage = 1; render(); }

function toggleHeart(id, btn) {
  if (liked.has(id)) { liked.delete(id); btn.classList.remove('liked'); }
  else { liked.add(id); btn.classList.add('liked'); }
}

// ═══════════════════════════════════════
//  모달
// ═══════════════════════════════════════
function openPost(id) {
  const p = POSTS.find(x => x.id === id);
  if (!p) return;

  // ── 메타 (아바타 + 작성자 + 날짜 · 읽기 시간) ──
  document.getElementById('modalMeta').innerHTML = `
    <div class="modal-avatar-txt">sn</div>
    <span class="modal-author">snsmedia</span>
    <span class="modal-dot">·</span>
    <span class="modal-date-txt">${p.date} · ${p.read}</span>
    <button class="modal-more">⋯</button>`;

  // ── 제목 (좌측 정렬) ──
  document.getElementById('modalTitle').textContent = p.title;

  // ── 본문: 첫 줄이 【...】이면 소제목으로 분리 ──
  const lines = p.body.split('\n');
  let headingHtml = '';
  let bodyText = p.body;
  if (lines[0].startsWith('【') && lines[0].endsWith('】')) {
    headingHtml = `<div class="modal-section-heading">${lines[0].replace(/【|】/g,'').trim()}</div>`;
    bodyText = lines.slice(1).join('\n').trim();
  }
  document.getElementById('modalText').innerHTML =
    headingHtml + `<div class="modal-text">${bodyText.replace(/\n/g,'<br>')}</div>`;

  // ── 이미지 (세로 중앙 정렬) ──
  document.getElementById('modalImgs').innerHTML = (p.images||[]).map(src =>
    `<img src="${src}" alt="첨부이미지" loading="lazy">`).join('');

  // ── PDF / 학회지 링크 ──
  let pdfHtml = '';
  if (p.pdf) {
    pdfHtml = `<a class="pdf-box" href="${p.pdf.url}" target="_blank" rel="noopener">
      <span class="ico">📄</span>
      <div><strong>${p.pdf.name}</strong><br><span style="color:var(--primary);font-size:0.78rem;">Google Drive에서 열기 →</span></div>
    </a>`;
  } else if (p.pdfs && p.pdfs.length) {
    pdfHtml = p.pdfs.map(f => `
      <a class="pdf-box" href="${f.url}" target="_blank" rel="noopener">
        <span class="ico">📄</span>
        <div><strong>${f.name}</strong><br><span style="color:var(--primary);font-size:0.78rem;">Google Drive에서 열기 →</span></div>
      </a>`).join('');
  }
  document.getElementById('modalPdf').innerHTML = pdfHtml;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeByOverlay(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// 초기 렌더
render();
</script>
</body>
</html>
